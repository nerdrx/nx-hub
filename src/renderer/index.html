<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NX Hub</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- The light the glass refracts: three slow blobs under everything. -->
    <div id="nebula" class="nebula" aria-hidden="true">
      <span class="neb neb-1"></span>
      <span class="neb neb-2"></span>
      <span class="neb neb-3"></span>
    </div>
    <header id="header">
      <canvas id="stars" class="star-layer star-far" aria-hidden="true"></canvas>
      <canvas id="stars-near" class="star-layer star-near" aria-hidden="true"></canvas>
      <div class="star-glow s1" aria-hidden="true"></div>
      <div class="star-glow s2" aria-hidden="true"></div>
      <div class="star-glow s3" aria-hidden="true"></div>
      <div class="head-inner">
        <span id="logo" class="logo-slot"></span>
        <h1>NX Hub</h1>
        <nav id="tabs" class="tabs" role="tablist" aria-label="Views">
          <button id="tab-launch" class="tab" data-act="view" data-view="launch" role="tab" aria-selected="false" aria-controls="launch">Launch</button>
          <button id="tab-manage" class="tab" data-act="view" data-view="manage" role="tab" aria-selected="false" aria-controls="manage-view">Manage</button>
        </nav>
        <div class="filter-wrap">
          <span id="filter-icon" class="filter-icon"></span>
          <input
            id="filter"
            class="filter"
            type="search"
            placeholder="Filter apps…"
            aria-label="Filter apps"
            autocomplete="off"
            spellcheck="false"
          />
          <kbd class="slash">/</kbd>
        </div>
        <span id="device-chip" class="device-slot"></span>
        <button id="stacks-btn" class="btn btn-icon head-btn" data-act="stacks" title="Stacks — launch several apps in order" aria-label="Stacks" hidden></button>
        <button id="refresh" class="btn btn-icon head-btn" data-act="refresh" title="Refresh — check GitHub for new releases" aria-label="Refresh"></button>
        <button id="settings-btn" class="btn btn-icon head-btn" data-act="settings" title="Settings" aria-label="Settings"></button>
      </div>
    </header>

    <main id="main">
      <div id="banner" class="banner-host"></div>
      <section id="launch" class="launch" role="tabpanel" aria-label="Launcher" hidden></section>
      <div id="manage-view" role="tabpanel" aria-label="Manage">
        <section id="grid" class="grid" aria-label="Apps"></section>
        <section id="unpublished" class="unpub" aria-label="Unpublished repositories"></section>
        <section id="hidden-apps" class="hidden-apps" aria-label="Hidden apps"></section>
      </div>
    </main>

    <div id="panel-root"></div>
    <div id="sheet-root"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <input id="import-file" type="file" accept="application/json,.json" hidden />
    <div id="boot-warning" hidden></div>

    <script src="./boot-check.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
