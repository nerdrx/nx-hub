<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NX Hub">
  <title>NX Hub tray</title>
<!--
  Tray variant of the NX Hub mark, tuned for 32px.

  The bevel, the well and every refractive edge are dropped: at 32px each of
  them lands on well under a pixel and only greys the silhouette. What is left
  is the part that carries the identity at that size - the hexagon and the NX -
  as a single flat brand-violet shape with the monogram knocked out.

  Knocking the letters out rather than drawing them light means the counters
  show whatever is behind them, so the mark reads on a light tray and a dark
  one, and it survives a monochrome tint intact (the holes stay holes).
-->
  <defs>
    <linearGradient id="nxg" x1="0.15" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="#9f63f7"/><stop offset="0.5" stop-color="#7718f2"/><stop offset="1" stop-color="#4812a0"/></linearGradient>
    <clipPath id="nxt"><rect x="0" y="185" width="512" height="142"/></clipPath>
    <mask id="nxm"><rect width="512" height="512" fill="#fff"/><g clip-path="url(#nxt)"><path d="M138.06,373L138.06,185L220.06,327L220.06,139 M266,145.16L394,366.84M394,145.16L266,366.84" fill="none" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke="#000" stroke-width="38"/></g></mask>
  </defs>
  <path d="M240.13,18.49Q256,10 271.87,18.49L470.13,124.51Q486,133 486,151L486,361Q486,379 470.13,387.49L271.87,493.51Q256,502 240.13,493.51L41.87,387.49Q26,379 26,361L26,151Q26,133 41.87,124.51Z" fill="url(#nxg)" mask="url(#nxm)"/>
</svg>
