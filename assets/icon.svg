<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NX Hub">
  <title>NX Hub</title>
<!--
  NX Hub. A beveled glass crystal: a pointy-top hexagon cut into a six-face
  bevel around a sunken, lit well, with the NX monogram sculpted from the same
  glass. Violet #7700FF family throughout, cyan #00e5ff only as the light
  trapped inside, on the app's own #0a0714 field.

  How it is built, from the outside in:

  1. Bevel. Each of the six faces is a separate quad running from the outer
     hexagon to the inner one. Its tone is not picked by hand - it is
     0.5 + 0.5*dot(face normal, light) with the light arriving from the upper
     left, mapped through one violet ramp. That is why the two upper faces
     read bright and the lower right reads nearly black: it is a single
     consistent lighting model, so the solid always looks like one object.
     Corners are rounded by splitting each corner arc at its midpoint and
     giving half to each neighbouring face, which keeps the band seamless
     without a single clip path.
  2. Well. A radial violet-to-near-black field with the same two lights the
     app's background runs on - violet up-left, cyan down-right - plus four
     specks of dust. Its rim carries a seam that is black where the wall turns
     away from the light and violet where it bounces back up.
  3. Refraction. Cyan catches on the inner lip of the three faces that turn
     toward the light; a hard white line runs along the outer silhouette on
     the same side. These two edges are what stop the shape reading as flat
     vector art.
  4. Monogram. The N is one continuous centre line (up, diagonal, up); the X
     is two crossing arms at the same slope. Both are stroked, then trimmed by
     a horizontal band at the cap lines - so every terminal, and every mitre
     that would otherwise spike past the cap, ends in a flat typographic cut.
     No <text>, no font, no traced outlines. A cyan casing sits under a
     white-to-violet face, giving the letters a lit top and an underglow.

  Small sizes do not use this file. assets/icons/{16,24,32}x*.png come from a
  simplified variant - wider hexagon, no bevel, no well, flat white monogram -
  because below 48px the bevel, the cyan fringe and the violet-footed letters
  all collapse into one smudge. assets/tray.svg is a third variant: flat brand
  violet with the monogram knocked out, so it stays legible on a light or a
  dark tray and survives being tinted.
-->
